name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # pkgconf for dear-imgui's build, which asks pkg-config for GLEW.
      - name: Install libusb, pkgconf and C compilers
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-i686-gcc

      # Games load the DLLs, 64- and 32-bit; npgame and trackdemo stand in
      # for a game. The programs, trackkat's too, get the cat icon.
      - name: Build the icon, NPClient DLLs, npgame and trackdemo
        shell: pwsh
        run: |
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          $flags = "-std=c11", "-Wall", "-Wextra", "-Werror", "-O2", "-s", "-shared", "-static-libgcc", "-Wl,--kill-at"
          $path = $env:PATH
          foreach ($t in @(@{ prefix = "ucrt64"; dll = "NPClient64.dll" }, @{ prefix = "mingw32"; dll = "NPClient.dll" })) {
            $env:PATH = "$msys\$($t.prefix)\bin;$path"
            & gcc @flags -o $t.dll npclient/npclient.c
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:PATH = "$msys\ucrt64\bin;$path"
          $icon = Join-Path "$env:RUNNER_TEMP" "trackkat-icon.o"
          "ICON_OBJECT=$icon" | Out-File -FilePath $env:GITHUB_ENV -Append
          & windres -I icons icons/trackkat.rc -O coff -o $icon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & gcc -std=c11 -Wall -Wextra -Werror -O2 -static -o npgame.exe tools/npgame.c $icon -ladvapi32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Compiler messages become annotations, which show without the log.
          $out = & gcc -std=c11 -Wall -Wextra -Werror -O2 -static -mwindows -o trackdemo.exe demo/trackdemo.c $icon `
            -lopengl32 -lgdi32 -luser32 -ladvapi32 2>&1
          $rc = $LASTEXITCODE
          $out | ForEach-Object { "::error::$_" }
          if ($rc -ne 0) { exit $rc }
          $env:PATH = $path

      # These match what the runner image has installed, so this is quick.
      - uses: haskell-actions/setup@v2
        id: haskell
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.2.0'

      - uses: actions/cache@v4
        with:
          path: ${{ steps.haskell.outputs.cabal-store }}
          key: windows-cabal-${{ hashFiles('trackkat.cabal', 'cabal.project.freeze') }}
          restore-keys: windows-cabal-

      - run: cabal update

      # bindings-GLFW builds GLFW into trackkat, but ImGui's GLFW backend,
      # built by dear-imgui, needs GLFW's header too: the same version's,
      # from bindings-GLFW's source. dear-imgui asks pkg-config for GLEW,
      # which ImGui's OpenGL 3 renderer doesn't use (it loads OpenGL itself),
      # so a stand-in for GLEW's pkg-config file answers, linking nothing.
      # MSYS2's pkg-config is put last on the path while building, so that
      # nothing else is taken from there. trackkat's programs link the icon.
      - name: Point the build at GLFW's header, pkg-config and the icon
        shell: pwsh
        run: |
          $usb = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64"
          "USB_PREFIX=$usb" | Out-File -FilePath $env:GITHUB_ENV -Append
          $pc = Join-Path "$env:RUNNER_TEMP" "pkgconfig"
          New-Item -ItemType Directory -Force $pc | Out-Null
          "Name: glew`nDescription: not used`nVersion: 2.2.0`nLibs:`nCflags:" | Out-File -FilePath (Join-Path $pc "glew.pc") -Encoding ascii
          "PKG_CONFIG_PATH=$pc" | Out-File -FilePath $env:GITHUB_ENV -Append
          cabal get bindings-GLFW-3.3.9.3 --destdir="$env:RUNNER_TEMP"
          $glfw = (Join-Path "$env:RUNNER_TEMP" "bindings-GLFW-3.3.9.3\glfw\include") -replace '\\', '/'
          $icon = $env:ICON_OBJECT -replace '\\', '/'
          "package dear-imgui`n  extra-include-dirs: $glfw`npackage trackkat`n  ghc-options: -optl$icon" | Out-File -FilePath cabal.project.local -Encoding ascii

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;$env:USB_PREFIX\bin"
          cabal build all --enable-tests `
            --extra-include-dirs="$env:USB_PREFIX\include" --extra-lib-dirs="$env:USB_PREFIX\lib"

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$env:USB_PREFIX\bin;$env:PATH"
          cabal test all --test-show-details=direct `
            --extra-include-dirs="$env:USB_PREFIX\include" --extra-lib-dirs="$env:USB_PREFIX\lib"

      - name: Package
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;$env:USB_PREFIX\bin"
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($name in "tirprobe", "trackkat") {
            $exe = cabal list-bin $name `
              --extra-include-dirs="$env:USB_PREFIX\include" --extra-lib-dirs="$env:USB_PREFIX\lib"
            Copy-Item $exe dist\
          }
          Copy-Item NPClient.dll, NPClient64.dll, npgame.exe, trackdemo.exe dist\
          Copy-Item "$env:USB_PREFIX\bin\libusb-1.0.dll" dist\
          Copy-Item README.md dist\

      # trackkat links GLFW and ImGui statically; only libusb, which ships
      # beside it, and Windows' own DLLs may be needed.
      - name: Check trackkat needs no other DLL
        shell: pwsh
        run: |
          $objdump = Join-Path "$env:USB_PREFIX" "bin\objdump.exe"
          $dlls = & $objdump -p dist\trackkat.exe | Select-String "DLL Name: (.*)" | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $dlls
          $system = '^(api-ms-win-.*|kernel32|user32|gdi32|shell32|advapi32|opengl32|hid|setupapi|winmm|ole32|oleaut32|imm32|dbghelp|ntdll|ucrtbase|msvcrt|ws2_32|wsock32|rpcrt4|shlwapi|version|bcrypt|crypt32|dwmapi|uxtheme|comctl32|libusb-1\.0)\.dll$'
          $other = $dlls | Where-Object { $_ -notmatch $system }
          if ($other) { "::error::trackkat.exe needs $($other -join ', ')"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: trackkat-windows
          path: dist

      # Artifacts need a GitHub login to download; release assets don't.
      - name: Publish dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist\* -DestinationPath trackkat-windows.zip
          gh release delete dev --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create dev trackkat-windows.zip --prerelease --target $env:GITHUB_SHA `
            --title "Development build" `
            --notes "Latest build of main ($env:GITHUB_SHA). Download trackkat-windows.zip below."

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config libglfw3-dev libglew-dev libgl-dev \
            libx11-dev libxi-dev libxrandr-dev libxxf86vm-dev libxcursor-dev libxinerama-dev
      - uses: haskell-actions/setup@v2
        id: haskell
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.1.0'
      - uses: actions/cache@v4
        with:
          path: ${{ steps.haskell.outputs.cabal-store }}
          key: linux-cabal-${{ hashFiles('trackkat.cabal', 'cabal.project.freeze') }}
          restore-keys: linux-cabal-
      - run: cabal update
      - run: cabal build all --enable-tests
      - run: cabal test all --test-show-details=direct
