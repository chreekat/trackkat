name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-libusb

      - uses: haskell-actions/setup@v2
        id: haskell
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'

      - uses: actions/cache@v4
        with:
          path: ${{ steps.haskell.outputs.cabal-store }}
          key: windows-cabal-${{ hashFiles('trackkat.cabal') }}
          restore-keys: windows-cabal-

      - name: Build
        shell: pwsh
        run: |
          $usb = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64"
          "USB_PREFIX=$usb" | Out-File -FilePath $env:GITHUB_ENV -Append
          cabal build all --enable-tests `
            --extra-include-dirs="$usb\include" --extra-lib-dirs="$usb\lib"

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$env:USB_PREFIX\bin;$env:PATH"
          cabal test all --test-show-details=direct `
            --extra-include-dirs="$env:USB_PREFIX\include" --extra-lib-dirs="$env:USB_PREFIX\lib"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = cabal list-bin tirprobe `
            --extra-include-dirs="$env:USB_PREFIX\include" --extra-lib-dirs="$env:USB_PREFIX\lib"
          Copy-Item $exe dist\
          Copy-Item "$env:USB_PREFIX\bin\libusb-1.0.dll" dist\
          Copy-Item README.md dist\

      - uses: actions/upload-artifact@v4
        with:
          name: trackkat-windows
          path: dist

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-version: '3.10'
      - run: cabal build all --enable-tests
      - run: cabal test all --test-show-details=direct
